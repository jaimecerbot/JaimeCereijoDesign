                <span data-es="En 2024 Systemtronic publicó un briefing para un perchero que encajase en su catálogo. Mi equipo diseñó y presenetó 4 opciones a la empresa, que se mostró muy interesada en una de ellas.

Après une refonte, j’ai réalisé deux panneaux avec des maquettes comme celle‑ci et préparé un discours grâce auquel nous avons réussi à faire sélectionner le porte‑manteau Hira face aux propositions de 12 autres équipes. Hira a été présenté à la Feria Hábitat València 2025." data-pt="Em setembro de 2024, a Systemtronic publicou um briefing para desenvolver um cabide que se enquadrasse no seu catálogo. A minha equipa concebeu e apresentou quatro opções; a empresa demonstrou grande interesse por uma delas.

Após um redesenho, fiz dois painéis com montagens e preparei um pitch com o qual a Systemtronic seleciou o cabide Hira em detrimento das propostas de outras 12 equipas. O Hira foi apresentado na Feria Hábitat València 2025."></span></div>

                <span data-es="En 2024 gané, junto a dos compañeros, un concurso de etiquetado que organiza la UPV. Alain Ferrer, Álvaro Selma y yo ganamos en la categoria de vinos. Por eso, en 2025, las botellas que la universidad envió como obsequio a otros centros llevaron nuestras etiquetas." data-en="In 2024 I was the winner, along with two classmates, in a labeling contest organized by the Polytechnic University of Valencia. Alain Ferrer, Álvaro Selma and I won in the wine category. That's why, in 2025, the bottles that the UPV sent as gifts to other centers bore our labels." data-fr="En 2024, j’ai remporté avec deux camarades un concours d’étiquetage organisé par l’Université Polytechnique de Valence. Nous avons gagné dans la catégorie des vins. C’est pourquoi, en 2025, les bouteilles que l’UPV a offertes à d’autres centres portaient nos étiquettes." data-pt="Em 2024, fui vencedor, juntamente com dois colegas, de um concurso de etiquetagem organizado pela Universidade Politécnica de Valência. Nos ganhámos na categoria de vinhos. Por isso, em 2025, as garrafas que a UPV enviou como presente para outros centros levavam as nossas etiquetas."></span>

                <span data-es="La propuesta que hicimos en la categoría de cervezas buscaba adaptar la identidad de la UPV la típica imagen de fraternidades universitarias estadounidenses. Creamos nueve mascotas y usamos colores representativos para cada escuela." data-en="Our proposal for the beer category sought to adapt UPV’s identity to the typical imagery of American university fraternities. We created nine mascots and used representative colors for each school." data-fr="Notre proposition pour la catégorie des bières visait à adapter l’identité de l’UPV à l’imagerie typique des fraternités universitaires américaines. Nous avons créé neuf mascottes et utilisé des couleurs représentatives pour chaque école." data-pt="A nossa proposta para a categoria de cervejas procurou adaptar a identidade da UPV ao imaginário típico das fraternidades universitárias americanas. Criámos nove mascotes e utilizámos cores representativas para cada escola."></span>

                <span data-es="En cuanto a los vinos, quisimos presentar un etiquetado sobrio que mostrase una visión romántica del Mediterráneo. Para ello, usamos una fuente gruesa con serifas suaves, concentrando todo el color en la 'N' para aludir a las letras capitales, tan populares durante el romanticismo." data-en="For the wines we opted for a sober label that conveys a romantic vision of the Mediterranean. We used a bold typeface with soft serifs, concentrating all color in the ‘N’ to evoke illuminated initials, so popular during Romanticism." data-fr="Pour les vins, nous avons choisi un étiquetage sobre qui présente une vision romantique de la Méditerranée. Nous avons utilisé une typographie épaisse aux empattements doux, en concentrant toute la couleur sur le « N » afin d’évoquer les lettres capitales, très populaires à l’époque du romantisme." data-pt="Para os vinhos, optámos por uma etiqueta sóbria que apresenta uma visão romântica do Mediterrâneo. Usámos uma tipografia espessa com serifas suaves, concentrando toda a cor no «N» para evocar as letras capitais, muito populares durante o romantismo."></span>
